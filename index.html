<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: #08090d;
            position: relative;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -15px;
            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(6px) brightness(0.65);
            transform: scale(1.02);
            z-index: -1;
        }

        .container {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            padding: 24px;
            overflow: hidden;
        }

        .particle-canvas {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .logo,
        .discord-link {
            position: relative;
            z-index: 1;
        }

        .logo {
            display: block;
            width: min(420px, 80vw);
            height: auto;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        .discord-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            color: #5865F2;
            text-decoration: none;
            background: transparent;
            border: none;
            outline: none;
            transition: transform 0.25s ease;
        }

        .discord-icon {
            width: 34px;
            height: 34px;
            fill: currentColor;
            transition:
                color 0.25s ease,
                filter 0.25s ease,
                transform 0.25s ease;
        }

        .discord-link:hover .discord-icon {
            color: #7289ff;
            filter:
                drop-shadow(0 0 5px #5865F2)
                drop-shadow(0 0 12px #5865F2)
                drop-shadow(0 0 22px #386bff);
            transform: scale(1.13);
        }

        .discord-link:focus-visible {
            border-radius: 12px;
            outline: 2px solid #7289ff;
            outline-offset: 5px;
        }

        .thank-you {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            background: #292a2e;
            color: #f1f1f1;
            text-align: center;
        }

        .thank-you p {
            max-width: 680px;
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            line-height: 1.7;
        }

        @media (max-width: 480px) {
            .logo {
                width: 85vw;
            }

            .container {
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <canvas class="particle-canvas" aria-hidden="true"></canvas>
        <img class="logo" src="Impact Logo.png" alt="Impact Menu">

        <a
            class="discord-link"
            href="https://discord.gg/UHz5JRKsbe"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Join the Impact Discord server"
        >
            <svg class="discord-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.1 0A72.37 72.37 0 0 0 45.65 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.14 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2.04 20.92 9.79 43.59 9.79 64.26 0 .87.7 1.76 1.38 2.66 2.04a68.68 68.68 0 0 1-10.87 5.19 77.1 77.1 0 0 0 6.89 11.13 105.25 105.25 0 0 0 32.2-16.14c2.64-27.37-4.52-51.09-18.84-72.14ZM42.45 65.69c-6.28 0-11.45-5.76-11.45-12.83s5.06-12.83 11.45-12.83c6.44 0 11.55 5.81 11.45 12.83 0 7.07-5.06 12.83-11.45 12.83Zm42.24 0c-6.28 0-11.45-5.76-11.45-12.83s5.06-12.83 11.45-12.83c6.44 0 11.55 5.81 11.45 12.83 0 7.07-5.01 12.83-11.45 12.83Z"/>
            </svg>
        </a>
    </main>

    <section class="thank-you" aria-label="Thank you">
        <p>Hey, thank you for using Impact Holdable! We really appreciate your support. There’s more to come, with new updates and features on the way. Thanks for being part of Impact!</p>
    </section>

    <script>
        const canvas = document.querySelector(".particle-canvas");
        const context = canvas.getContext("2d");
        const hero = document.querySelector(".container");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const particles = [];
        const connectionDistance = 150;
        let width = 0;
        let height = 0;
        let animationFrame;

        function resizeCanvas() {
            const bounds = hero.getBoundingClientRect();
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            width = bounds.width;
            height = bounds.height;
            canvas.width = Math.round(width * pixelRatio);
            canvas.height = Math.round(height * pixelRatio);
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            const desiredCount = Math.max(35, Math.min(100, Math.round(width * height / 14000)));
            while (particles.length < desiredCount) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    radius: Math.random() * 1.5 + 1
                });
            }
            particles.length = desiredCount;
            drawFrame(false);
        }

        function drawFrame(moveParticles = true) {
            context.clearRect(0, 0, width, height);

            if (moveParticles && !reducedMotion.matches) {
                for (const particle of particles) {
                    particle.x += particle.vx;
                    particle.y += particle.vy;

                    if (particle.x <= 0 || particle.x >= width) particle.vx *= -1;
                    if (particle.y <= 0 || particle.y >= height) particle.vy *= -1;
                    particle.x = Math.max(0, Math.min(width, particle.x));
                    particle.y = Math.max(0, Math.min(height, particle.y));
                }
            }

            for (let i = 0; i < particles.length; i++) {
                const particle = particles[i];
                for (let j = i + 1; j < particles.length; j++) {
                    const other = particles[j];
                    const dx = particle.x - other.x;
                    const dy = particle.y - other.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < connectionDistance) {
                        context.strokeStyle = `rgba(255, 220, 220, ${0.32 * (1 - distance / connectionDistance)})`;
                        context.lineWidth = 0.8;
                        context.beginPath();
                        context.moveTo(particle.x, particle.y);
                        context.lineTo(other.x, other.y);
                        context.stroke();
                    }
                }
            }

            for (const particle of particles) {
                context.beginPath();
                context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                context.fillStyle = "rgba(255, 225, 225, 0.78)";
                context.fill();
            }

            if (!reducedMotion.matches) {
                animationFrame = requestAnimationFrame(() => drawFrame(true));
            }
        }

        const resizeObserver = new ResizeObserver(resizeCanvas);
        resizeObserver.observe(hero);
        window.addEventListener("resize", resizeCanvas);
        reducedMotion.addEventListener("change", () => {
            cancelAnimationFrame(animationFrame);
            drawFrame(false);
        });
        resizeCanvas();
    </script>
</body>
</html>
